<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Work - SafeBite</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body data-content="work">
    <!-- 导航栏 -->
    <nav class="navbar">
        <div class="navbar-inner">
            <a href="/official/index.html" class="navbar-brand">SafeBite</a>
            <ul class="navbar-nav">
                <li><a href="/official/index.html">All About Us</a></li>
                <li><a href="/official/join-us.html">Join Us</a></li>
                <li><a href="/official/our-work.html" class="active">Our Work</a></li>
                <li><a href="/official/donations.html">Donations</a></li>
            </ul>
        </div>
    </nav>

    <div class="page-wrapper">
        <!-- Hero 区域 -->
        <section class="work-hero">
            <h1></h1>
            <p></p>
        </section>

        <!-- 分类标签 -->
        <div class="work-tabs">
            <button class="work-tab active" onclick="filterWork('all', this)">全部</button>
            <button class="work-tab" onclick="filterWork('articles', this)">文章</button>
            <button class="work-tab" onclick="filterWork('videos', this)">视频</button>
            <button class="work-tab" onclick="filterWork('projects', this)">项目</button>
        </div>

        <!-- 内容卡片 -->
        <div class="work-grid" id="workGrid"></div>
    </div>

    <!-- Footer -->
    <footer class="footer">
        <p>&copy; 2025 SafeBite. All rights reserved.</p>
    </footer>

    <!-- 筛选脚本 -->
    <script>
        function filterWork(category, btn) {
            var tabs = document.querySelectorAll('.work-tab');
            var cards = document.querySelectorAll('.work-card');
            tabs.forEach(function (tab) { tab.classList.remove('active'); });
            if (btn) btn.classList.add('active');
            cards.forEach(function (card) {
                card.style.display = (category === 'all' || card.dataset.category === category) ? 'block' : 'none';
            });
        }
    </script>
    <link rel="stylesheet" href="/css/edit.css">
    <script src="/js/edit.js"></script>
    <script src="/js/content.js"></script>
</body>
</html>
