<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>加入我们 - SafeBite</title>
    <meta name="theme-color" content="#ffffff">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌿</text></svg>">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body data-content="join">
    <a class="skip-link" href="#main">跳到主要内容</a>

    <!-- 导航栏 -->
    <nav class="navbar">
        <div class="navbar-inner">
            <a href="/official/index.html" class="navbar-brand">SafeBite</a>
            <ul class="navbar-nav">
                <li><a href="/official/index.html">关于我们</a></li>
                <li><a href="/official/join-us.html" class="active">加入我们</a></li>
                <li><a href="/official/our-work.html">我们的成果</a></li>
                <li><a href="/official/donations.html">捐赠</a></li>
            </ul>
        </div>
    </nav>

    <div class="page-wrapper" id="main">
        <!-- Hero 区域 -->
        <section class="join-hero">
            <h1></h1>
            <p></p>
        </section>

        <!-- 内容区 -->
        <section class="join-content">
            <!-- 报名表单 -->
            <form class="join-form" onsubmit="event.preventDefault(); alert('感谢您的关注！我们会尽快与您联系。');">
                <div class="form-group">
                    <label for="name">姓名 *</label>
                    <input type="text" id="name" name="name" required placeholder="请输入您的姓名">
                </div>
                <div class="form-group">
                    <label for="email">电子邮箱 *</label>
                    <input type="email" id="email" name="email" required placeholder="请输入您的邮箱">
                </div>
                <div class="form-group">
                    <label for="phone">联系电话</label>
                    <input type="tel" id="phone" name="phone" placeholder="请输入您的电话（选填）">
                </div>
                <div class="form-group">
                    <label for="interest">您感兴趣的领域 *</label>
                    <select id="interest" name="interest" required>
                        <option value="">请选择...</option>
                        <option value="volunteer">志愿者服务</option>
                        <option value="professional">专业支持</option>
                        <option value="content">内容创作</option>
                        <option value="events">活动组织</option>
                        <option value="other">其他</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="message">留言</label>
                    <textarea id="message" name="message" placeholder="请简单介绍一下您自己，或者您想如何参与..."></textarea>
                </div>
                <button type="submit" class="btn-submit">提交申请</button>
            </form>
        </section>
    </div>

    <!-- Footer -->
    <footer class="footer">
        <div class="footer-inner">
            <div class="footer-brand">🌿 SafeBite</div>
            <p class="footer-tagline">让每一口都安心</p>
            <nav class="footer-nav">
                <a href="/official/index.html">关于我们</a>
                <a href="/official/join-us.html">加入我们</a>
                <a href="/official/our-work.html">我们的成果</a>
                <a href="/official/donations.html">捐赠</a>
            </nav>
            <p class="footer-copy">&copy; 2026 SafeBite. All rights reserved.</p>
        </div>
    </footer>
    <link rel="stylesheet" href="/css/edit.css">
    <script src="/js/edit.js"></script>
    <script src="/js/content.js"></script>
</body>
</html>
