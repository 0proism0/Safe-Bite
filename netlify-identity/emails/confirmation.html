<h2>确认你的账号</h2>
<p>你的确认码是：</p>
<p style="font-size:22px;font-weight:bold;letter-spacing:1px;word-break:break-all;">{{ .Token }}</p>
<p>请打开 <a href="{{ .SiteURL }}/admin/confirm.html#confirmation_token={{ .Token }}">{{ .SiteURL }}/admin/confirm.html</a>，粘贴上面的确认码完成验证。</p>
<p style="color:#888;font-size:12px;">如果链接无法点击，请复制链接到浏览器打开。确认码仅可使用一次。</p>
