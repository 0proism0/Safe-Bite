page_title: Join Us - SafeBite
hero_title: Join Us
hero_desc: 加入我们的行列，一起为食品安全和健康贡献力量
content_sections:
  - heading: 为什么加入我们？
    content: |
      在 SafeBite，每一位志愿者和成员都是我们推动变革的重要力量。
      无论你拥有什么技能、背景或经验，只要你有热情和意愿，
      就能在这里找到属于你的位置，为社区带来积极的影响。

      我们提供多种参与方式，包括：

      • **志愿者服务** - 参与社区活动、食品安全检查、教育宣传等
      • **专业支持** - 如果你有食品科学、营养、法律等专业背景，欢迎提供专业指导
      • **内容创作** - 帮助撰写文章、制作视频，传播食品安全知识
      • **活动组织** - 协助策划和执行各类线上线下活动
