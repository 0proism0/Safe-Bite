<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录中... - SafeBite CMS</title>
</head>
<body>
    <script>
        // GitHub OAuth 回调处理
        (function() {
            var hash = window.location.hash.substring(1);
            var params = new URLSearchParams(hash);
            var accessToken = params.get('access_token');
            
            if (accessToken) {
                // 存储 token
                localStorage.setItem('decap-cms-auth', JSON.stringify({
                    token: accessToken,
                    provider: 'github'
                }));
                
                // 重定向到 admin
                window.location.href = '{{ site.baseurl }}/admin/';
            } else {
                document.body.innerHTML = '<p style="text-align:center;margin-top:50px;">登录失败，请重试。<a href="{{ site.baseurl }}/admin/">返回后台</a></p>';
            }
        })();
    </script>
    <p style="text-align:center;margin-top:50px;">正在登录...</p>
</body>
</html>
