<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>内容管理 - SafeBite</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌿</text></svg>">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
            background: linear-gradient(180deg, #eef4f0 0%, #f5f6f8 240px);
            color: #333;
            min-height: 100vh;
        }

        /* 移动端输入框 ≥16px，防止 iOS 聚焦自动缩放 */
        @media (max-width: 768px) {
            .login-card input,
            .field input[type="text"],
            .field input[type="date"],
            .field textarea,
            .field select {
                font-size: 16px;
            }
        }

        /* ===== 登录界面 ===== */
        #login-screen {
            position: fixed;
            inset: 0;
            background: #f5f6f8;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }
        .login-card {
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 12px 40px rgba(27, 67, 50, 0.12);
            padding: 36px 30px;
            width: 360px;
            border: 1px solid rgba(27, 67, 50, 0.06);
        }
        .login-card h1 { font-size: 20px; margin-bottom: 6px; }
        .login-card p { font-size: 13px; color: #888; margin-bottom: 18px; }
        .login-card input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            margin-bottom: 12px;
        }
        .login-card button {
            width: 100%;
            padding: 11px;
            border: 0;
            border-radius: 10px;
            background: #2d6a4f;
            color: #fff;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all .2s ease;
        }
        .login-card button:hover { background: #1b4332; transform: translateY(-1px); }
        .login-error { color: #d93025; font-size: 13px; margin-top: 10px; min-height: 18px; }

        /* ===== 编辑器 ===== */
        #editor { display: none; max-width: 860px; margin: 0 auto; padding: 24px 16px 80px; }
        #editor header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
        }
        #editor header h1 { font-size: 20px; }
        .btn {
            padding: 9px 18px;
            border: 0;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
        }
        .btn-primary { background: #2d6a4f; color: #fff; }
        .btn-primary:disabled { background: #9dbfae; cursor: default; }
        .btn-primary:not(:disabled):hover { background: #1b4332; }
        .btn-small { padding: 5px 12px; font-size: 13px; background: #d8f3dc; color: #1b4332; }
        .btn-danger { background: #fce8e6; color: #d93025; }

        .tabs { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 20px; }
        .tab {
            padding: 8px 16px;
            border-radius: 20px;
            background: #fff;
            border: 1px solid #e0e0e0;
            font-size: 14px;
            cursor: pointer;
        }
        .tab.active { background: #2d6a4f; color: #fff; border-color: #2d6a4f; box-shadow: 0 3px 10px rgba(45,106,79,.3); }

        .panel {
            background: #fff;
            border-radius: 14px;
            padding: 26px;
            box-shadow: 0 2px 12px rgba(27,67,50,.07);
            border: 1px solid rgba(27,67,50,.05);
        }
        .field { margin-bottom: 18px; }
        .field > label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; color: #444; }
        .field input[type="text"],
        .field input[type="date"],
        .field textarea,
        .field select {
            width: 100%;
            padding: 9px 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
        }
        .field textarea { min-height: 110px; resize: vertical; line-height: 1.6; }
        .field input[type="text"]:focus,
        .field input[type="date"]:focus,
        .field textarea:focus,
        .field select:focus {
            outline: none;
            border-color: #40916c;
            box-shadow: 0 0 0 3px rgba(64,145,108,.15);
        }
        .field .hint { font-size: 12px; color: #595959; margin-top: 4px; }
        .file-preview { font-size: 13px; margin-top: 6px; }
        .file-preview a { color: #2d6a4f; text-decoration: underline; word-break: break-all; }

        .list-item {
            border: 1px solid #e5e5e5;
            border-radius: 10px;
            padding: 16px;
            margin-bottom: 14px;
            background: #fafafa;
        }
        .list-item-head {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        .list-item-head .title { font-size: 13px; color: #888; }
        .list-actions { display: flex; gap: 8px; }
        .add-item { margin-top: 4px; }

        .img-preview {
            max-width: 160px;
            max-height: 100px;
            border-radius: 8px;
            display: block;
            margin-top: 8px;
            border: 1px solid #eee;
        }
        .img-row { display: flex; gap: 10px; align-items: flex-end; }
        .img-row .field { flex: 1; margin-bottom: 0; }

        .status-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 12px 16px;
            background: #fff;
            border-top: 1px solid #e5e5e5;
            display: flex;
            justify-content: center;
            gap: 14px;
            align-items: center;
            font-size: 14px;
        }
        #status-msg.ok { color: #188038; }
        #status-msg.error { color: #d93025; }

        /* 手动保存提示 */
        #manual-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,.5);
            z-index: 200;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        #manual-overlay.open { display: flex; }
        .manual-card {
            background: #fff;
            border-radius: 12px;
            padding: 24px;
            max-width: 640px;
            width: 100%;
            max-height: 85vh;
            overflow: auto;
        }
        .manual-card h2 { font-size: 17px; margin-bottom: 10px; }
        .manual-card ol { font-size: 13px; color: #555; padding-left: 20px; line-height: 1.9; margin-bottom: 12px; }
        .manual-card textarea {
            width: 100%;
            height: 220px;
            font-family: ui-monospace, Menlo, monospace;
            font-size: 12px;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 8px;
            background: #f8f9fa;
        }
        .manual-card .row { display: flex; gap: 10px; margin-top: 12px; justify-content: flex-end; }
    </style>
</head>
<body>
    <!-- 登录 -->
    <div id="login-screen">
        <form class="login-card" id="login-form">
            <h1>🔐 内容管理后台</h1>
            <p>请输入编辑密码</p>
            <input type="password" id="login-password" placeholder="编辑密码" autofocus>
            <button type="submit">进入后台</button>
            <div class="login-error" id="login-error"></div>
        </form>
    </div>

    <!-- 编辑器 -->
    <div id="editor">
        <header>
            <h1>✏️ SafeBite 内容管理</h1>
            <button class="btn" id="logout-btn">退出</button>
        </header>
        <div class="tabs" id="tabs"></div>
        <div class="panel" id="form-panel"></div>
    </div>

    <!-- 保存状态栏 -->
    <div class="status-bar" id="status-bar" style="display:none;">
        <span id="status-msg"></span>
        <button class="btn btn-primary" id="save-btn">💾 保存更改</button>
    </div>

    <!-- 手动保存（服务器无 PHP 时） -->
    <div id="manual-overlay">
        <div class="manual-card">
            <h2>⚠️ 服务器未启用 PHP，需要手动替换文件</h2>
            <ol>
                <li>复制下面方框里的全部内容</li>
                <li>在你的服务器上找到文件 <b>_data/<span id="manual-file"></span>.json</b></li>
                <li>用复制的内容<b>整体替换</b>该文件并保存</li>
                <li>刷新网站即可看到更改</li>
            </ol>
            <textarea id="manual-json" readonly></textarea>
            <div class="row">
                <button class="btn btn-small" id="manual-copy">📋 复制内容</button>
                <button class="btn btn-primary" id="manual-close">完成</button>
            </div>
        </div>
    </div>

    <script src="admin.js"></script>
</body>
</html>
